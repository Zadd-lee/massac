# 로컬 개발용 MySQL, Redis. 실행: docker compose up -d
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: massac
      MYSQL_USER: ${DB_USERNAME:-massac}
      MYSQL_PASSWORD: ${DB_PASSWORD:-massac}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      TZ: Asia/Seoul
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7.4
    ports:
      - "6379:6379"

volumes:
  mysql-data:
