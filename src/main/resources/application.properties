spring.application.name=Massac

# 로컬 기본값은 docker-compose.yml과 맞춘다. 운영 환경에서는 환경변수로 덮어쓴다.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/massac}
spring.datasource.username=${DB_USERNAME:massac}
spring.datasource.password=${DB_PASSWORD:massac}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.repositories.enabled=false
