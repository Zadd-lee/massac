name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # 소스 코드 가져오기
      - uses: actions/checkout@v4

      # build.gradle의 toolchain과 같은 Java 17 설치
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Gradle 설치와 의존성 캐시
      - uses: gradle/actions/setup-gradle@v4

      # 테스트 실행. Testcontainers가 러너의 Docker로 MySQL, Redis를 띄운다.
      - name: Test
        run: ./gradlew test

      # 실패 원인을 볼 수 있게 테스트 리포트 업로드
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test
